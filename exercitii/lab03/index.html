<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorul 03 – JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="titlu">Laboratorul 03</h1>

  <button id="btn-tema" type="button">Schimbă tema</button>
  <button id="btn-reset" type="button">Resetează</button>

  <h2>Formular</h2>

  <form id="formular" novalidate>
    <label for="nume">Numele vostru</label>
    <input
      id="nume"
      name="nume"
      type="text"
      autocomplete="name"
      aria-describedby="eroare-nume"
    >
    <button type="submit">Trimite</button>
    <p id="eroare-nume" class="eroare" aria-live="polite"></p>
  </form>

  <p>
    Previzualizare: Salut,
    <strong id="previzualizare">...</strong>!
  </p>

  <h2>Vremea în Bacău</h2>

  <button id="btn-vreme" type="button">Afișează vremea</button>
  <p id="stare" role="status"></p>
  <ul id="vreme"></ul>

  <script src="script.js"></script>
</body>
</html>
