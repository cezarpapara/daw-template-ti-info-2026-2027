<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorul 03 - JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="titlu">Laboratorul 03</h1>
  <button id="btn-tema" type="button">Schimba tema</button>
  <!-- Exercitiul 1: readuce titlul initial si goleste lista vremii -->
  <button id="btn-reset" type="button">Reseteaza</button>

  <h2>Formular</h2>
  <!-- novalidate: validarea o facem noi, din JavaScript -->
  <form id="formular" novalidate>
    <label for="nume">Numele vostru</label>
    <input id="nume" type="text" autocomplete="name">
    <button type="submit">Trimite</button>
    <p id="eroare-nume" class="eroare"></p>
  </form>
  <p>Previzualizare: Salut, <strong id="previzualizare">...</strong>!</p>

  <h2>Vremea</h2>
  <!-- Exercitiul 4: valoarea fiecarei optiuni este "latitudine,longitudine" -->
  <label for="oras">Orasul</label>
  <select id="oras">
    <option value="46.57,26.91">Bacau</option>
    <option value="47.16,27.59">Iasi</option>
    <option value="44.43,26.10">Bucuresti</option>
    <option value="46.77,23.60">Cluj-Napoca</option>
  </select>
  <button id="btn-vreme" type="button">Afiseaza vremea</button>
  <p id="stare"></p>
  <ul id="vreme"></ul>

  <!-- scriptul se incarca la final, dupa ce toate elementele de mai sus exista in DOM -->
  <script src="script.js"></script>
</body>
</html>
