# Configurarea Nginx pentru Symfony (containerul daw-nginx)
# https://symfony.com/doc/current/setup/web_server_configuration.html
server {
    listen 80;
    server_name localhost;
    root /var/www/app/public;

    location / {
        # daca fisierul cerut nu exista, cererea merge la Symfony (index.php)
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # trimite cererea catre containerul PHP (daw-php), pe portul 9000 (PHP-FPM)
        fastcgi_pass daw-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # alte fisiere .php nu sunt accesibile din browser
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 20M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
