; Setari PHP pentru dezvoltare (containerul daw-php)
date.timezone = Europe/Bucharest
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
display_errors = On
error_reporting = E_ALL

; OPcache: fisierele modificate sunt recitite imediat (important in dezvoltare)
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
