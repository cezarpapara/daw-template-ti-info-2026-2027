# ==========================================================================
#  FRONTEND - 1 container:
#    daw-react -> aplicatia React (Vite, modul dev)   http://localhost:5173
#
#  Comenzile se ruleaza din FOLDERUL PRINCIPAL al proiectului:
#    Pornire:  docker compose -f frontend/compose.yaml up -d --build
#    Oprire:   docker compose -f frontend/compose.yaml stop
# ==========================================================================
name: daw-frontend

services:
  daw-react:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
    container_name: daw-react
    ports:
      - "5173:5173"
    volumes:
      # codul din frontend/app apare in container in /app;
      # modificarile salvate se vad imediat in browser (fara build din nou)
      - ./app:/app
      # node_modules ramane doar in container (nu se amesteca cu Windows/macOS)
      - /app/node_modules
